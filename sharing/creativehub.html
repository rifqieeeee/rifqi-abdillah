<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Creative Hub | Media Kreatif TI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#f7f5ff; }
    iframe { display:block; width:100%; height:100dvh; border:0; }
  </style>
</head>
<body>
  <iframe id="creativeHub" title="Media Kreatif TI — Creative Hub" allow="clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    'use strict';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxa6IE6VbJX3FDdbounHmf4mpWIqbzQ83njaYIxQsT4t6m4SyzaavRQykwcleferQ/exec';
    const params = new URLSearchParams(window.location.search);
    const reviewId = params.get('review');
    const target = new URL(GAS_URL);
    if (reviewId) target.searchParams.set('review', reviewId);
    document.getElementById('creativeHub').src = target.href;
  </script>
</body>
</html>

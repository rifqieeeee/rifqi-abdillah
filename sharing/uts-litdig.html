
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Pengisian Formulir</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    #status {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 40px 28px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
      width: 100%;
      max-width: 460px;
    }

    h1 { font-size: 25px; }
    p { color: #64748b; line-height: 1.7; }

    #clock {
      font-size: 38px;
      font-weight: bold;
      color: #2563eb;
      margin: 20px 0;
    }

    #countdown {
      font-size: 25px;
      font-weight: bold;
      margin-top: 15px;
    }

    .schedule {
      background: #eff6ff;
      padding: 14px;
      border-radius: 10px;
      margin-top: 20px;
      color: #1d4ed8;
      line-height: 1.8;
    }

    #formContainer {
      display: none;
      position: fixed;
      inset: 0;
      background: white;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div id="status">
    <div class="card">
      <h1 id="title">Portal Pengisian Formulir</h1>
      <p id="message"></p>

      <div id="clock"></div>
      <div id="countdown"></div>

      <div class="schedule">
        Jadwal Akses<br>
        <strong>Jumat, 16 Oktober 2026</strong><br>
        <strong>10.00 - 10.50 WIB</strong>
      </div>
    </div>
  </div>

  <div id="formContainer">
    <iframe
      id="googleForm"
      title="Google Form"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    const FORM_URL =
      "https://docs.google.com/forms/d/e/" +
      "1FAIpQLSdBD8bO3Zqb3xwDmgAgWjKzgwwo8aNmqIHmGGuP_M7DokaUCw/" +
      "viewform?embedded=true";

    // Jadwal berdasarkan WIB (UTC+7)
    const OPEN_TIME = new Date("2026-10-16T10:00:00+07:00");
    const CLOSE_TIME = new Date("2026-10-16T10:50:00+07:00");

    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const clock = document.getElementById("clock");
    const countdown = document.getElementById("countdown");
    const status = document.getElementById("status");
    const container = document.getElementById("formContainer");
    const iframe = document.getElementById("googleForm");

    function formatTime(seconds) {
      const days = Math.floor(seconds / 86400);
      const h = Math.floor((seconds % 86400) / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;

      const time = [h, m, s]
        .map(n => String(n).padStart(2, "0"))
        .join(":");

      return days > 0 ? `${days} hari ${time}` : time;
    }

    function checkAccess() {
      const now = new Date();

      const timeWIB = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Jakarta",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).format(now);

      clock.textContent = timeWIB + " WIB";

      if (now >= OPEN_TIME && now < CLOSE_TIME) {
        status.style.display = "none";
        container.style.display = "block";

        if (!iframe.getAttribute("src")) {
          iframe.src = FORM_URL;
        }

      } else {
        status.style.display = "flex";
        container.style.display = "none";

        if (iframe.getAttribute("src")) {
          iframe.removeAttribute("src");
        }

        if (now < OPEN_TIME) {
          title.textContent = "Formulir Belum Dibuka";
          message.textContent =
            "Formulir dapat diakses pada Jumat, 16 Oktober 2026 pukul 10.00 WIB.";

          const remaining = Math.ceil(
            (OPEN_TIME.getTime() - now.getTime()) / 1000
          );

          countdown.textContent =
            "Dibuka dalam " + formatTime(remaining);

        } else {
          title.textContent = "Waktu Telah Berakhir";
          message.textContent =
            "Batas waktu pengisian formulir adalah Jumat, 16 Oktober 2026 pukul 10.50 WIB.";

          countdown.textContent = "Akses Ditutup";
        }
      }
    }

    checkAccess();
    setInterval(checkAccess, 1000);
  </script>

</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Portal Pengisian Formulir</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    #status {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 40px 28px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
      width: 100%;
      max-width: 460px;
    }

    h1 { font-size: 25px; }
    p { color: #64748b; line-height: 1.7; }

    #clock {
      font-size: 38px;
      font-weight: bold;
      color: #2563eb;
      margin: 20px 0;
    }

    #countdown {
      font-size: 25px;
      font-weight: bold;
      margin-top: 15px;
    }

    .schedule {
      background: #eff6ff;
      padding: 14px;
      border-radius: 10px;
      margin-top: 20px;
      color: #1d4ed8;
    }

    #formContainer {
      display: none;
      position: fixed;
      inset: 0;
      background: white;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div id="status">
    <div class="card">
      <h1 id="title">Portal Pengisian Formulir</h1>
      <p id="message"></p>

      <div id="clock"></div>
      <div id="countdown"></div>

      <div class="schedule">
        Jadwal Akses<br>
        <strong>09.50 - 10.40 WIB</strong>
      </div>
    </div>
  </div>

  <div id="formContainer">
    <iframe
      id="googleForm"
      title="Google Form"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    const FORM_URL =
      "https://docs.google.com/forms/d/e/" +
      "1FAIpQLSdBD8bO3Zqb3xwDmgAgWjKzgwwo8aNmqIHmGGuP_M7DokaUCw/" +
      "viewform?embedded=true";

    const OPEN_MINUTE = 9 * 60 + 50;
    const CLOSE_MINUTE = 10 * 60 + 40;

    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const clock = document.getElementById("clock");
    const countdown = document.getElementById("countdown");
    const status = document.getElementById("status");
    const container = document.getElementById("formContainer");
    const iframe = document.getElementById("googleForm");

    function formatTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return [h, m, s]
        .map(n => String(n).padStart(2, "0"))
        .join(":");
    }

    function checkAccess() {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Jakarta",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      const get = type =>
        Number(parts.find(p => p.type === type).value);

      const h = get("hour");
      const m = get("minute");
      const s = get("second");

      const currentSeconds = h * 3600 + m * 60 + s;
      const openSeconds = OPEN_MINUTE * 60;
      const closeSeconds = CLOSE_MINUTE * 60;

      clock.textContent =
        [h, m, s]
          .map(n => String(n).padStart(2, "0"))
          .join(":") + " WIB";

      if (currentSeconds >= openSeconds &&
          currentSeconds < closeSeconds) {

        status.style.display = "none";
        container.style.display = "block";

        if (!iframe.src) {
          iframe.src = FORM_URL;
        }

      } else {
        status.style.display = "flex";
        container.style.display = "none";

        // Hapus form ketika akses telah ditutup.
        if (iframe.src) {
          iframe.removeAttribute("src");
        }

        if (currentSeconds < openSeconds) {
          title.textContent = "Formulir Belum Dibuka";
          message.textContent =
            "Formulir dapat diakses mulai pukul 09.50 WIB.";

          countdown.textContent =
            "Dibuka dalam " +
            formatTime(openSeconds - currentSeconds);

        } else {
          title.textContent = "Waktu Telah Berakhir";
          message.textContent =
            "Batas waktu pengisian formulir adalah 10.40 WIB.";

          countdown.textContent = "Akses Ditutup";
        }
      }
    }

    checkAccess();
    setInterval(checkAccess, 1000);
  </script>

</body>
</html>

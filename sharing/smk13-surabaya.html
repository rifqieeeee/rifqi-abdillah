  <script>
    function copyDocumentLink(button) {

      // Link yang akan dicopy
      const documentURL =
        'https://drive.google.com/drive/folders/1rlp6btIthT1WnFBIm1GUyvA9sOG3K57Y?usp=sharing';

      navigator.clipboard.writeText(documentURL).then(function () {

        const originalText = button.innerHTML;

        button.innerHTML =
          '<i class="bi bi-check2"></i> Copied';

        button.classList.remove('btn-outline-primary');
        button.classList.add('btn-success');

        const alertBox = document.getElementById('copyAlert');
        alertBox.style.display = 'block';

        setTimeout(function () {

          button.innerHTML = originalText;

          button.classList.remove('btn-success');
          button.classList.add('btn-outline-primary');

          alertBox.style.display = 'none';

        }, 1800);

      }).catch(function () {
        alert('Gagal menyalin link materi.');
      });

    }
  </script>

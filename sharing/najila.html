<style>

</style></head><body>
<div id="app"><div id="hud"><div id="mis"></div><button class="b" id="bH">?</button><button class="b" id="bS">♪</button><button class="b" id="bP">II</button></div>
<div id="inv"></div><div id="cv"><canvas id="c"></canvas></div>
<div id="ctl"><div id="joy"><i id="knob"></i></div><button id="act">Aksi</button></div>

<script>
'use strict';
/* ===== DATA ===== */
const W=360,H=420,TAU=Math.PI*2,K='najilaSave1',$=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d');
const SC=['Kebun','Desa','Dapur','Pasar'];
const ING={telur:['Telur',0,'#fff1cc','e'],tomat:['Tomat',0,'#e5483b','o'],wortel:['Wortel',0,'#f08a24','e'],kunyit:['Kunyit',0,'#e0a21a','e'],pisang:['Pisang',0,'#f5d442','b'],pandan:['Pandan',0,'#3fa066','e'],
nasi:['Nasi',1,'#f7f7f2','bag'],gula:['Gula',1,'#ffffff','bag'],susu:['Susu',1,'#e3efff','bag'],bawang:['Bawang',1,'#c58fd6','o'],beras:['Beras',1,'#efe2c0','bag'],
kentang:['Kentang',3,'#c9a26b','o'],kubis:['Kubis',3,'#7ac36a','o'],tepung:['Tepung',3,'#f4f0e4','bag'],ayam:['Ayam',3,'#e8b07a','e'],madu:['Madu',3,'#d89b1b','o'],kelapa:['Kelapa',3,'#8a5a3a','o']};
const CH=[
{n:'Nasi Goreng Ceria',d:'Najila, ayo bantu Ibu membuat nasi goreng untuk sarapan! Petik telur dan tomat di Kebun, lalu ambil nasi di Desa.',i:['telur','tomat','nasi'],s:['wash','chop','stir','plate']},
{n:'Sayur Sop Hangat',d:'Hari ini Ibu mau memasak sayur sop. Pasar sudah dibuka! Ambil wortel di Kebun, kentang dan kubis di Pasar.',i:['wortel','kentang','kubis'],s:['wash','chop','heat','stir','plate']},
{n:'Pisang Goreng Renyah',d:'Adik minta pisang goreng! Pisang ada di Kebun, tepung di Pasar, dan gula di Desa.',i:['pisang','tepung','gula'],s:['chop','stir','heat','timing','plate']},
{n:'Soto Ayam Spesial',d:'Kakek akan datang. Kita buat soto ayam! Ayam dari Pasar, kunyit dari Kebun, bawang di Desa.',i:['ayam','kunyit','bawang'],s:['wash','chop','stir','heat','timing','plate']},
{n:'Pancake Madu',d:'Teman-teman datang bermain! Buat pancake madu: tepung dan madu di Pasar, susu di Desa, telur di Kebun.',i:['tepung','madu','susu','telur'],s:['stir','heat','timing','timing','plate']},
{n:'Nasi Kuning Pesta',d:'Pesta keluarga! Siapkan nasi kuning: beras di Desa, kunyit dan pandan di Kebun, kelapa di Pasar.',i:['beras','kunyit','pandan','kelapa'],s:['wash','chop','stir','heat','timing','plate']}];
const TX={wash:['Cuci bahan','Usap bolak-balik di atas mangkuk!'],chop:['Potong','Ketuk lingkaran yang menyala!'],stir:['Aduk','Putar jarimu melingkar di panci!'],heat:['Atur api','Tahan layar agar api naik. Jaga di zona hijau!'],timing:['Waktu tepat','Ketuk saat penanda di zona emas!'],plate:['Tata piring','Ketuk bahan sesuai nomor!']};
const NP={0:[{x:70,y:290,n:'Nenek Tani',pal:{h:'#a3c585',t:'#f2e0b0',k:'#8d6e63'},l:['Kebunku subur! Ambil bahan yang berkilau, ya.','Bunga-bunga di sini cantik, kumpulkan semuanya!']}],1:[{x:270,y:255,n:'Ibu',ibu:1,pal:{h:'#4db6ac',t:'#ffe0b2',k:'#00897b'}}],2:[],3:[{x:200,y:255,n:'Bu Pedagang',pal:{h:'#ffb74d',t:'#fff3e0',k:'#ef6c00'},l:['Selamat datang di pasar! Sayurku segar semua.','Cari yang berkilau ya, Najila!']}]};
const fresh=()=>({ch:0,st:0,inv:[],fc:[],stars:0,rec:[],snd:1});
/* ===== STATE ===== */
let S=fresh(),mode='title',pm=null,sc=1,P={x:180,y:330,f:1,w:0,pk:0,mv:0},T=0,keys={},jv={x:0,y:0},mg=null,ms=0,parts=[],near=null,AC=null,SN=1,pk=[],dq=[],dcb=null,dn='',lastAct=0,scl=1;
const ptr={down:0,x:0,y:0};
/* ===== STORAGE ===== */
function save(){S.snd=SN;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}}
function wipe(){try{localStorage.removeItem(K)}catch(e){}}
/* ===== AUDIO ===== */
function initAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function snd(f,d=.12,t='sine',v=.14){if(!AC||!SN)return;const o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.value=f;a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(n+d)}
const SF={pick:()=>{snd(660,.1);setTimeout(()=>snd(880,.14),90)},tap:()=>snd(440,.07,'triangle'),no:()=>snd(240,.16,'sine',.1),ok:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>snd(f,.2),i*110)),step:()=>{snd(600,.08,'triangle');setTimeout(()=>snd(800,.1,'triangle'),80)}};
/* ===== UI ===== */
function ov(c,h){const o=$('#ov');o.className=c;o.innerHTML=h;o.style.display='flex'}
function hide(){$('#ov').style.display='none'}
const pn=h=>`<div class="pn">${h}</div>`;
let tt=0;function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2200)}
function hud(){const c=CH[S.ch];$('#mis').innerHTML=c?`Bab ${S.ch+1}/6 · ${c.n} ⭐${S.stars}<br><small>${['Misi 1/3: Temui Ibu di Desa','Misi 2/3: Kumpulkan bahan ('+S.inv.length+'/'+c.i.length+')','Misi 3/3: Masak di Dapur'][S.st]}</small>`:`Tamat! Semua resep selesai ⭐${S.stars}`;
$('#inv').innerHTML=c&&S.st>0?c.i.map(id=>{const h=S.inv.includes(id);return`<span class="chip" style="${h?'':'opacity:.6'}"><i style="background:${ING[id][2]}"></i>${ING[id][0]}${h?' ✓':' · '+SC[ING[id][1]]}</span>`}).join(''):'<span class="chip">Bicara dengan Ibu untuk mendapat bahan</span>'}
function title(){mode='title';sc=1;pk=[];P.x=180;P.y=330;P.mv=0;document.body.classList.remove('mini');fit();ov('ttl',pn(`<h2 style="font-size:28px">Najila<br>Si Koki Cilik</h2><p>Jelajahi desa, kumpulkan bahan, lalu masak untuk keluarga!</p>${load()?'<button data-a="cont">Lanjutkan</button>':''}<button data-a="nw">Permainan Baru</button><button class="g" data-a="hp">Cara Main</button>`))}
function help(back){ov('',pn(`<h2>Cara Main</h2><p>Geser joystick (atau panah/WASD) untuk berjalan. Tombol Aksi (Spasi) untuk bicara dan memasak. Sentuh bahan yang berkilau untuk mengambilnya. Lengkapi bahan, lalu masak di Dapur. Mini-game boleh diulang, tidak ada hukuman!</p><button data-a="${back}">Kembali</button>`))}
function pausePanel(){ov('',pn(`<h2>Jeda</h2><button data-a="res">Lanjut Main</button><button class="g" data-a="snd">Suara: ${SN?'Nyala':'Mati'}</button><button class="g" data-a="rc">Koleksi Resep</button><button class="g" data-a="hp2">Bantuan</button><button class="g" data-a="menu">Menu Utama</button>`))}
function recipes(){ov('',pn(`<h2>Koleksi Resep</h2><p style="text-align:left">${CH.map((c,i)=>i<S.rec.length?`⭐ ${c.n}`:'🔒 ???').join('<br>')}</p><p>Dekorasi dapur: ${S.rec.length} lukisan, ${S.fc.length>>2} vas bunga</p><button data-a="pp">Kembali</button>`))}
function pauseGame(){if(mode=='play'||mode=='mini'){pm=mode;mode='pause';pausePanel()}}
function act(a){({nx:nextLine,cont:()=>start(load()),nw:()=>load()?conf():start(null),yes:()=>{wipe();start(null)},ttl:title,hp:()=>help('ttl'),hp2:()=>help('pp'),pp:pausePanel,rc:recipes,res:()=>{mode=pm;hide()},snd:()=>{SN=SN?0:1;save();pausePanel()},menu:()=>{save();title()},fin:fin}[a]||(()=>{}))()}
function conf(){ov('',pn('<h2>Hapus progres?</h2><p>Progres lama akan hilang dan tidak bisa dikembalikan.</p><button data-a="yes">Ya, mulai baru</button><button class="g" data-a="ttl">Batal</button>'))}
$('#ov').addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;initAudio();SF.tap();act(a.dataset.a)});
$('#bP').onclick=()=>{initAudio();pauseGame()};$('#bH').onclick=()=>{initAudio();if(mode=='play'||mode=='mini'){pm=mode;mode='pause';help('pp')}};$('#bS').onclick=()=>{initAudio();SN=SN?0:1;save();toast('Suara '+(SN?'nyala':'mati'));SF.tap()};
function start(d){S=Object.assign(fresh(),d||{});SN=S.snd;sc=1;P.x=180;P.y=330;mode='play';hide();spawn();hud();save()}
/* ===== DIALOG ===== */
function say(name,lines,cb){mode='dlg';dq=[...lines];dn=name;dcb=cb;nextLine()}
function nextLine(){if(mode!='dlg')return;if(!dq.length){hide();mode='play';const f=dcb;dcb=null;f&&f();return}ov('dlg',pn(`<b style="color:#c2416b">${dn}</b><p>${dq.shift()}</p><button data-a="nx">Lanjut</button>`))}
/* ===== WORLD LOGIC ===== */
function spawn(){pk=[];const c=CH[S.ch];if(c&&S.st>=1)c.i.forEach((id,i)=>{if(ING[id][1]==sc&&!S.inv.includes(id))pk.push({id,x:50+((i*97+S.ch*61)%260),y:200+((i*71+S.ch*43)%180)})});for(let k=0;k<3;k++){const id='f'+sc+k;if(!S.fc.includes(id))pk.push({id,fl:1,x:40+((k*113+sc*71)%280),y:180+((k*59+sc*37)%210)})}}
function burst(x,y){for(let i=0;i<12;i++){const a=Math.random()*TAU;parts.push({x,y,vx:Math.cos(a)*80,vy:Math.sin(a)*80-60,l:.7,c:['#ffd166','#ff6b95','#8ecae6','#9be37f'][i%4]})}}
function collect(p){pk=pk.filter(q=>q!==p);P.pk=.7;burst(p.x,p.y);SF.pick();if(p.fl){S.fc.push(p.id);toast('Bunga cantik! 🌸 '+S.fc.length+'/12'+(S.fc.length%4?'':' · Vas baru di dapur!'))}else{S.inv.push(p.id);toast(ING[p.id][0]+' diambil!');if(S.inv.length==CH[S.ch].i.length){S.st=2;setTimeout(()=>toast('Bahan lengkap! Ayo ke Dapur!'),1200)}}save();hud()}
function go(d){const n=sc+d;if(n<0||n>3){P.x=Math.max(8,Math.min(W-8,P.x));return}if(n==3&&S.ch<1){toast('Pasar belum dibuka. Selesaikan Bab 1 dulu!');P.x=W-10;return}sc=n;P.x=d>0?16:W-16;spawn()}
function talk(n){if(n.ibu){const c=CH[S.ch];if(!c)return say('Ibu',['Terima kasih, koki kecilku! Semua resep sudah kamu kuasai.']);
if(S.st==0)return say('Ibu',[c.d],()=>{S.st=1;spawn();hud();save();toast('Misi baru: kumpulkan bahan!')});
if(S.st==1)return say('Ibu',['Bahan yang masih kurang: '+c.i.filter(i=>!S.inv.includes(i)).map(i=>ING[i][0]+' ('+SC[ING[i][1]]+')').join(', ')+'.']);
return say('Ibu',['Bahannya sudah lengkap! Ayo masak di Dapur.'])}
say(n.n,[n.l[Math.floor(Math.random()*n.l.length)]])}
function doAct(){const n=Date.now();if(n-lastAct<250||mode!='play'||!near)return;lastAct=n;initAudio();SF.tap();if(near.t=='npc')talk(near.o);else{const c=CH[S.ch];if(!c)return toast('Semua resep sudah selesai!');if(S.st<2)return say('Najila',[S.st==0?'Aku harus bertemu Ibu dulu.':'Bahannya belum lengkap.']);cook()}}
/* ===== COOKING ===== */
function cook(){mode='mini';ms=0;document.body.classList.add('mini');fit();stepStart()}
function stepStart(){const c=CH[S.ch],t=c.s[ms];mg={t,p:0,x:0,d:1,h:.3,n:0,a:null,acc:0,rot:0,sh:0,f:0,dist:0,pl:[],tg:{x:180,y:230}};if(t=='chop')newTgt();if(t=='plate')mg.o=c.i.map((_,i)=>i).sort((a,b)=>((a*7+S.ch)%5)-((b*7+S.ch)%5))}
function newTgt(){mg.tg={x:70+Math.random()*220,y:185+Math.random()*100}}
function mgUpd(dt){const m=mg;if(!m||m.done)return;m.sh=Math.max(0,m.sh-dt);m.f=Math.max(0,m.f-dt);m.rot+=dt*2;
if(m.t=='heat'){m.h=Math.max(0,Math.min(1,m.h+(ptr.down?.55:-.4)*dt));if(m.h>.42&&m.h<.72)m.p+=dt/2.6}
if(m.t=='timing'){m.x+=m.d*dt*(.55+m.n*.12);if(m.x>1){m.x=1;m.d=-1}if(m.x<0){m.x=0;m.d=1}}
if(m.p>=1){m.p=1;m.done=1;SF.ok();burst(180,230);setTimeout(()=>{ms++;if(ms<CH[S.ch].s.length)stepStart();else finish()},800)}}
function mgDown(){const m=mg;if(!m||m.done)return;const{x,y}=ptr;
if(m.t=='chop'&&Math.hypot(x-m.tg.x,y-m.tg.y)<38){m.n++;m.p=m.n/5;m.f=.2;SF.step();burst(m.tg.x,m.tg.y);newTgt()}
if(m.t=='timing'){m.f=.6;if(m.x>.38&&m.x<.62){m.n++;m.p=m.n/3;m.ok=1;SF.step();burst(180,200)}else{m.ok=0;SF.no()}}
if(m.t=='plate'){const c=CH[S.ch],n=c.i.length;for(let i=0;i<n;i++){const px=180+(i-(n-1)/2)*80;if(m.pl.includes(i)||Math.hypot(x-px,y-350)>34)continue;if(m.o[m.pl.length]==i){m.pl.push(i);m.p=m.pl.length/n;SF.step()}else{m.sh=.3;SF.no()}}}
if(m.t=='stir'||m.t=='wash'){m.a=null;m.lx=x;m.ly=y}}
function mgMove(){const m=mg;if(!m||m.done||!ptr.down)return;const{x,y}=ptr;
if(m.t=='wash'&&m.lx!=null){m.p=Math.min(1,m.p+Math.hypot(x-m.lx,y-m.ly)/1100);if(Math.random()<.3)SF.tap&&snd(300+Math.random()*200,.04,'triangle',.05);m.lx=x;m.ly=y}
if(m.t=='stir'){const dx=x-180,dy=y-230;if(Math.hypot(dx,dy)<25)return;const a=Math.atan2(dy,dx);if(m.a!=null){let d=a-m.a;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;m.acc+=Math.abs(d);m.p=Math.min(1,m.acc/(TAU*3))}m.a=a}}
function finish(){const c=CH[S.ch];S.stars+=3;S.rec.push(c.n);S.ch++;S.st=0;S.inv=[];save();mode='wait';
ov('',pn(`<h2>🎉 ${c.n} jadi!</h2><p>Hadiah: +3 ⭐, resep baru, dan lukisan baru untuk dapur!${S.ch==1?'<br><b>Pasar telah dibuka!</b>':''}${S.ch>=6?'<br><b>Kamu menamatkan semua bab! Hebat, Najila!</b>':'<br>Temui Ibu lagi di Desa untuk misi berikutnya.'}</p><button data-a="fin">Lanjut</button>`))}
function fin(){document.body.classList.remove('mini');mode='play';sc=2;P.x=180;P.y=300;spawn();hud();fit();hide();toast('Progres tersimpan 💾')}
/* ===== DRAW HELPERS ===== */
const rr=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)},ci=(x,y,r,c)=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()},el=(x,y,a,b,c,r=0)=>{g.fillStyle=c;g.beginPath();g.ellipse(x,y,a,b,r,0,7);g.fill()},tri=(a,b,c,d,e,f,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.fill()},tx=(s,x,y,sz,c='#3b2a1a')=>{g.fillStyle=c;g.font=`bold ${sz}px sans-serif`;g.textAlign='center';g.fillText(s,x,y)};
function ingr(id,x,y,s=1){const[,,c,k]=ING[id];g.save();g.translate(x,y);g.scale(s,s);
if(k=='o'){ci(0,0,13,c);ci(-4,-4,4,'rgba(255,255,255,.5)')}else if(k=='e'){el(0,0,16,10,c,-.5);el(-4,-3,6,2.5,'rgba(255,255,255,.5)',-.5)}
else if(k=='b'){g.strokeStyle=c;g.lineWidth=9;g.lineCap='round';g.beginPath();g.arc(0,-6,14,.3,2.8);g.stroke()}
else{rr(-12,-12,24,26,c);rr(-12,-12,24,6,'rgba(0,0,0,.15)');g.strokeStyle='#a0845c';g.lineWidth=2;g.strokeRect(-12,-12,24,26)}g.restore()}
function flower(x,y){rr(x-1,y,2,12,'#4caf50');for(let i=0;i<5;i++)ci(x+Math.cos(i*1.256)*6,y+Math.sin(i*1.256)*6,4.5,'#ff8fb1');ci(x,y,3.5,'#ffd166')}
function najila(x,y,s,t,m,pal,mv,f=1){pal=pal||{h:'#ff7fa6',t:'#ffd0a6',k:'#7b6bd6'};g.save();g.translate(x,y);g.scale(s*f,s);
const sw=mv?Math.sin(t*9):0,bob=Math.abs(sw)*2+(mv?0:Math.sin(T*3)*.8);el(0,2,20,6,'rgba(0,0,0,.18)');g.translate(0,-bob);
el(-7+sw*4,0,7,4,'#6b4423');el(7-sw*4,0,7,4,'#6b4423');
